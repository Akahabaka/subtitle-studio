name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SubtitleStudio/SubtitleStudio.csproj --configuration Release
      - run: dotnet publish SubtitleStudio/SubtitleStudio.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - run: ./scripts/Verify-Runtime.ps1 -Directory publish
